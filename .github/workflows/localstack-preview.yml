name: LocalStack application preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      LOCALSTACK_API_KEY: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: infrastructure/pom.xml

      - name: Build service images
        shell: pwsh
        run: ./scripts/build-images.ps1

      - name: Publish service images to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

          registry_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in patient-service billing-service analytics-service auth-service api-gateway; do
            image="$registry_prefix/$service:${GITHUB_SHA}"
            docker tag "$service:latest" "$image"
            docker push "$image"
          done

          echo "IMAGE_PREFIX=$registry_prefix" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Install AWS LocalStack client
        shell: bash
        run: |
          python3 -m pip install --user 'awscli-local[ver1]'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create remote LocalStack preview
        shell: bash
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${LOCALSTACK_AUTH_TOKEN:-}" ]]; then
            echo "LOCALSTACK_AUTH_TOKEN is not configured for this repository."
            exit 1
          fi

          preview_name="patient-management-${GITHUB_RUN_ID}"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "ls-api-key: ${LOCALSTACK_AUTH_TOKEN}" \
            --header "authorization: token ${LOCALSTACK_AUTH_TOKEN}" \
            --header 'content-type: application/json' \
            --data '{"auto_load_pod":"false"}' \
            "https://api.localstack.cloud/v1/previews/${preview_name}")"

          echo "$response" | jq .
          endpoint_url="$(jq -r '.endpointUrl // .endpoint_url // empty' <<< "$response")"
          preview_id="$(jq -r '.id // .previewId // .preview_id // .instanceId // .instance_id // empty' <<< "$response")"

          if [[ -z "$endpoint_url" ]]; then
            echo "LocalStack did not return a preview endpoint."
            exit 1
          fi

          # The API has returned different id field names across preview versions.
          # Keep the id when present so failed runs can be cleaned up, but do not
          # make a successful deployment depend on that optional response field.
          echo "LOCALSTACK_PREVIEW_ID=$preview_id" >> "$GITHUB_ENV"
          echo "LOCALSTACK_PREVIEW_NAME=$preview_name" >> "$GITHUB_ENV"
          echo "AWS_ENDPOINT_URL=$endpoint_url" >> "$GITHUB_ENV"
          echo "LS_PREVIEW_URL=$endpoint_url" >> "$GITHUB_ENV"
          echo "LocalStack endpoint: $endpoint_url"

      - name: Wait for LocalStack preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent "${AWS_ENDPOINT_URL%/}/_localstack/health" > /dev/null; then
              echo "LocalStack preview is ready."
              exit 0
            fi
            sleep 5
          done

          echo "LocalStack preview did not become ready in time."
          exit 1

      - name: Deploy CDK to remote LocalStack
        shell: pwsh
        run: ./infrastructure/localstack-deploy.ps1

      - name: Create shareable gateway preview URL
        shell: bash
        run: |
          load_balancer_name="$(awslocal elbv2 describe-load-balancers \
            --query 'LoadBalancers[0].LoadBalancerName' \
            --output text)"

          if [[ -z "$AWS_ENDPOINT_URL" || "$AWS_ENDPOINT_URL" == "None" ]]; then
            echo "AWS_ENDPOINT_URL was not returned by the LocalStack preview API."
            exit 1
          fi

          preview_url="${AWS_ENDPOINT_URL%/}/_aws/elb/${load_balancer_name}/"
          echo "LS_PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "TEST_BASE_URL=$preview_url" >> "$GITHUB_ENV"

          {
            echo "## LocalStack application preview"
            echo
            echo "[$preview_url]($preview_url)"
            echo
            echo "This preview remains available for the configured ephemeral-instance lifetime."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for gateway health
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent "${TEST_BASE_URL}/actuator/health"; then
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Gateway did not become healthy in time."
          exit 1

      - name: Run gateway integration tests
        run: mvn -B -f integration-tests/pom.xml test

      - name: Comment gateway preview URL on pull request
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.LS_PREVIEW_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Patient-management gateway preview: ${previewUrl}`
            });

      - name: Stop preview if the workflow fails
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${LOCALSTACK_PREVIEW_ID:-}" ]]; then
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "ls-api-key: ${LOCALSTACK_AUTH_TOKEN}" \
              --header "authorization: token ${LOCALSTACK_AUTH_TOKEN}" \
              "https://api.localstack.cloud/v1/previews/${LOCALSTACK_PREVIEW_ID}"
          fi

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localstack-preview-artifacts
          path: infrastructure/cdk.out
          if-no-files-found: ignore
