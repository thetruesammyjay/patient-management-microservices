name: LocalStack deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: infrastructure/pom.xml

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: latest
          install-awslocal: 'true'
          use-pro: 'true'

      - name: Install LocalStack CLI
        run: npm install --global @localstack/lstk

      - name: Build service images
        shell: pwsh
        run: ./scripts/build-images.ps1

      - name: Deploy CDK infrastructure
        shell: pwsh
        run: ./infrastructure/localstack-deploy.ps1

      - name: Discover gateway endpoint
        shell: bash
        run: |
          gateway_dns="$(awslocal elbv2 describe-load-balancers \
            --query 'LoadBalancers[0].DNSName' \
            --output text)"

          echo "TEST_BASE_URL=http://${gateway_dns}" >> "$GITHUB_ENV"
          echo "Gateway endpoint: http://${gateway_dns}"

      - name: Wait for gateway health
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent "${TEST_BASE_URL}/actuator/health"; then
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Gateway did not become healthy in time."
          exit 1

      - name: Run gateway integration tests
        run: mvn -B -f integration-tests/pom.xml test

      - name: Capture LocalStack diagnostics on failure
        if: failure()
        shell: bash
        run: |
          curl --fail --silent http://localhost:4566/_localstack/diagnose \
            | gzip -c > localstack-diagnose.json.gz || true

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localstack-deployment-artifacts
          path: |
            infrastructure/cdk.out
            localstack-diagnose.json.gz
          if-no-files-found: ignore
