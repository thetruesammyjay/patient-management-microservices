spring.application.name=auth-service
server.port=${SERVER_PORT:4005}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# Development fallback only. Deployments must supply JWT_SECRET.
jwt.secret=${JWT_SECRET:WW91ckRldmVsb3BtZW50U2VjcmV0S2V5MTIzNDU2Nzg5MA==}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
